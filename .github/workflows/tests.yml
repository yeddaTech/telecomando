name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Python Telecomando supports, and the newest one
          - { os: ubuntu-22.04, python: '3.9' }
          - { os: ubuntu-latest, python: '3.x' }
          - { os: windows-latest, python: '3.9' }
          - { os: windows-latest, python: '3.x' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
